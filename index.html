*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit}.app{height:100vh;display:flex;background:radial-gradient(circle at 55% 18%,rgba(91,156,255,.06),transparent 28%),var(--bg)}
.sidebar{width:268px;background:rgba(12,12,14,.94);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:6px;transition:.25s;z-index:5}.sidebar-top{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 10px}.brand{font-size:20px;font-weight:700;letter-spacing:-.5px}.icon-btn,.nav-btn,.history-item,.profile{border:0;background:transparent;color:var(--text);cursor:pointer}.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}.icon-btn:hover{background:var(--hover);color:#fff}
.new-chat{height:44px;border:1px solid #3a3a40;background:#27272a;color:#fff;border-radius:12px;padding:0 13px;display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;transition:.2s}.new-chat:hover{background:#303035;transform:translateY(-1px)}.plus{font-size:25px;font-weight:300;line-height:0}.nav{display:flex;flex-direction:column;gap:2px;margin-top:2px}.nav-btn{height:40px;padding:0 12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:10px;font-size:14px;color:#d4d4d8}.nav-btn:hover{background:var(--hover)}.section-label{font-size:12px;color:#81818a;padding:17px 12px 7px}.history{flex:1;overflow:auto;min-height:0}.history-item{width:100%;padding:10px 12px;border-radius:9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c6c6cb;font-size:14px}.history-item:hover,.history-item.active{background:var(--hover);color:#fff}.sidebar-footer{border-top:1px solid var(--line);padding:8px 0 0}.profile{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left}.profile:hover{background:var(--hover)}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:14px}.profile-info{min-width:0;flex:1}.profile-name{font-size:14px}.profile-plan{font-size:11px;color:var(--muted);margin-top:2px}
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.mobile-menu{display:none}.model{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}.model-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}.top-actions{display:flex;gap:5px}.top-action{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:8px 10px;border-radius:9px;font-size:14px}.top-action:hover{background:var(--hover);color:#fff}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px 120px;animation:fade .45s ease}.welcome-mark{width:52px;height:52px;border-radius:16px;background:var(--icon) center/cover no-repeat;display:grid;place-items:center;margin-bottom:22px;animation:rgbGlow 6s linear infinite}.welcome h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1.4px;font-weight:600;text-align:center}.welcome p{color:var(--muted);font-size:15px;margin-top:9px;text-align:center}.suggestions{width:min(100%,720px);display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:34px}.suggestion{min-height:100px;padding:16px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(30,30,34,.88),rgba(18,18,20,.88));cursor:pointer;text-align:left;color:var(--text);transition:.2s}.suggestion:hover{border-color:#4a6da7;background:#202027;transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.2)}.suggestion-icon{font-size:18px;margin-bottom:14px}.suggestion-title{font-size:14px;font-weight:600}.suggestion-desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}

/* ИСПРАВЛЕНИЕ: Гарантируем строго вертикальный список сообщений */
.messages{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:26px max(24px,calc((100% - 760px)/2));gap:25px}

.message{display:flex;gap:13px;animation:fade .22s ease}.message-avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700}.user .message-avatar{background:#27272a}.bot .message-avatar{background:var(--icon) center/cover no-repeat}.message-body{min-width:0;flex:1}.msg-author{font-size:14px;font-weight:600;margin:3px 0 7px}.msg-text{font-size:15px;line-height:1.65;color:#e4e4e7;white-space:pre-wrap;overflow-wrap:anywhere}.sources-block{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#121216;font-size:13px}.sources-title{font-weight:600;margin-bottom:7px}.sources-block ul{padding-left:18px;display:grid;gap:5px}.sources-block a{color:#78a9ff;text-decoration:none}.sources-block a:hover{text-decoration:underline}
.composer-wrap{padding:10px max(18px,calc((100% - 820px)/2)) 20px;background:linear-gradient(transparent,rgba(9,9,11,.94) 35%)}.composer{border:1px solid #39393f;background:rgba(42,42,46,.94);border-radius:24px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.28);transition:border-color .2s,box-shadow .2s}.composer:focus-within{border-color:#555b69;box-shadow:0 12px 44px rgba(0,0,0,.4)}.attach{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#c8c8cf;cursor:pointer;font-size:24px}.attach:hover{background:#37373d}.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:15px;padding:8px 2px}.composer input::placeholder{color:#b3b3bc}.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:18px;transition:.2s}.send:hover{filter:brightness(1.1);transform:scale(1.04)}.send:disabled{opacity:.45;cursor:not-allowed;transform:none}.disclaimer{text-align:center;font-size:11px;color:#71717a;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(7px);align-items:center;justify-content:center;z-index:20}.modal-content{width:min(92vw,420px);background:#18181c;border:1px solid #34343a;border-radius:20px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.6)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modal h3{font-size:18px}.close{border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.field{margin-top:13px}.field label{display:block;font-size:13px;color:#c8c8cf;margin-bottom:7px}.field input{width:100%;height:42px;border:1px solid var(--line);background:#101014;border-radius:10px;color:#fff;padding:0 12px;outline:0}.field input:focus{border-color:#527dcc}.save{margin-top:20px;width:100%;height:42px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.context-menu{display:none;position:fixed;z-index:30;background:#202025;border:1px solid #3a3a41;border-radius:10px;padding:4px;box-shadow:0 15px 45px rgba(0,0,0,.5)}.context-item{padding:9px 12px;border-radius:7px;color:#ff838c;font-size:13px;cursor:pointer}.context-item:hover{background:#2c2c31}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes rgbFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}@keyframes rgbGlow{0%{box-shadow:0 0 34px 8px #ff5f6d}20%{box-shadow:0 0 34px 8px #ffc371}40%{box-shadow:0 0 34px 8px #47e0a7}60%{box-shadow:0 0 34px 8px #5b9cff}80%{box-shadow:0 0 34px 8px #c471ed}100%{box-shadow:0 0 34px 8px #ff5f6d}}@media(max-width:760px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);box-shadow:20px 0 50px rgba(0,0,0,.4)}.sidebar.open{transform:none}.mobile-menu{display:grid}.suggestions{grid-template-columns:1fr}.welcome{padding-bottom:70px}.topbar{padding:0 10px}.messages{padding:20px 15px}.composer-wrap{padding:8px 12px 14px}.disclaimer{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top"><div class="brand" id="botLogoText">BEDAI</div><button class="icon-btn" onclick="toggleSidebar()">☰</button></div>
  <button class="new-chat" onclick="createNewChat()"><span class="plus">＋</span><span>Новый чат</span></button>
  <nav class="nav"><button class="nav-btn" onclick="createNewChat()">⌕ <span>Поиск и чат</span></button><button class="nav-btn" onclick="quickAsk('Помоги мне с: ')">✦ <span>Исследовать</span></button></nav>
  <div class="section-label">Недавнее</div><div class="history" id="chatHistory"></div>
  <div class="sidebar-footer"><button class="profile" onclick="toggleSettings()"><div class="avatar" id="profileAvatar">П</div><div class="profile-info"><div class="profile-name" id="profileName">Пользователь</div><div class="profile-plan">BEDAI Free</div></div><span style="color:#888">⋯</span></button></div>
</aside>
<main class="main">
  <header class="topbar"><button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button><div class="model"><span class="model-dot"></span><span id="topBotName">BEDAI</span></div><div class="top-actions"><button class="top-action" onclick="createNewChat()">Новый чат</button><button class="icon-btn" onclick="toggleSettings()">⚙</button></div></header>
  <section class="welcome" id="welcomeScreen"><div class="welcome-mark" id="welcomeBadge"></div><h1 id="greetingTitle">Чем могу помочь?</h1><p>Спрашивайте, создавайте, исследуйте и находите идеи.</p><div class="suggestions"><button class="suggestion" onclick="quickAsk('Помоги решить задачу: ')"><div class="suggestion-icon">◈</div><div class="suggestion-title">Решить задачу</div><div class="suggestion-desc">Разберём проблему шаг за шагом</div></button><button class="suggestion" onclick="quickAsk('Объясни простыми словами: ')"><div class="suggestion-icon">✦</div><div class="suggestion-title">Объяснить сложное</div><div class="suggestion-desc">Понятно, коротко и с примерами</div></button><button class="suggestion" onclick="quickAsk('Придумай идеи для: ')"><div class="suggestion-icon">✎</div><div class="suggestion-title">Придумать идеи</div><div class="suggestion-desc">Помогу с концепциями и вариантами</div></button><button class="suggestion" onclick="quickAsk('Найди информацию о: ')"><div class="suggestion-icon">⌕</div><div class="suggestion-title">Исследовать тему</div><div class="suggestion-desc">Разобраться в вопросе глубже</div></button></div></section>
  <section class="messages" id="messages"></section>
  <div class="composer-wrap"><div class="composer"><button class="attach" title="Добавить">＋</button><input id="userInput" autocomplete="off" placeholder="Напишите сообщение..." onkeydown="handleKey(event)"><button class="send" id="sendBtn" onclick="send()" title="Отправить">↑</button></div><div class="disclaimer">BEDAI может ошибаться. Проверяйте важную информацию.</div></div>
</main></div>
<div class="modal" id="settingsModal"><div class="modal-content"><div class="modal-head"><h3>Настройки</h3><button class="close" onclick="toggleSettings()">×</button></div><div class="field"><label>Ваше имя</label><input id="settingUserName"></div><div class="field"><label>Имя ассистента</label><input id="settingBotName"></div><button class="save" onclick="saveSettings()">Сохранить изменения</button></div></div>
<div class="context-menu" id="contextMenu"><div class="context-item" onclick="deleteTargetChat()">Удалить чат</div></div>

<script>
let currentUserName='Пользователь', currentBotName='BEDAI', contextTargetElement=null, isSending=false;
let chats = {}; // База всех чатов в памяти
let currentChatId = null;

const $=id=>document.getElementById(id);

window.onload=async()=>{
    try{
        const res=await fetch('/api/settings');
        if(!res.ok)throw 0;
        const data=await res.json();
        if(data.user_name)currentUserName=data.user_name;
        if(data.bot_name)currentBotName=data.bot_name;
    }catch(e){}
    updateUI();
};

function updateUI(){
    const initial=(currentUserName||'П').trim().charAt(0).toUpperCase();
    const botInitial=(currentBotName||'B').trim().charAt(0).toUpperCase();
    $('greetingTitle').textContent=`Чем могу помочь, ${currentUserName}?`;
    $('botLogoText').textContent=currentBotName;
    $('topBotName').textContent=currentBotName;
    $('profileName').textContent=currentUserName;
    $('profileAvatar').textContent=initial;
    
    $('settingUserName').value=currentUserName;
    $('settingBotName').value=currentBotName;
}

function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }
function quickAsk(text){ $('userInput').value=text; $('userInput').focus(); if(innerWidth<=760)closeSidebar(); }
function toggleSidebar(){ $('sidebar').classList.toggle('open'); }
function closeSidebar(){ $('sidebar').classList.remove('open'); }

function createNewChat(){
    currentChatId = null;
    $('messages').innerHTML = '';
    $('messages').style.display = 'none';
    $('welcomeScreen').style.display = 'flex';
    $('userInput').value = '';
    
    // Снимаем подсветку со всех чатов
    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
    closeSidebar();
    $('userInput').focus();
}

async function send(){
    const input=$('userInput'), text=input.value.trim();
    if(!text||isSending) return;
    
    isSending=true;
    $('sendBtn').disabled=true;
    
    // Если это первый запрос в текущей сессии — создаем новый ID чата
    if(!currentChatId) {
        currentChatId = 'chat_' + Date.now();
        chats[currentChatId] = [];
        addChatToSidebar(currentChatId, text);
    }

    $('welcomeScreen').style.display='none';
    $('messages').style.display='flex';
    
    // Рисуем сообщение юзера и сохраняем
    addMessage('Вы', text, 'user');
    chats[currentChatId].push({ author: 'Вы', text: text, type: 'user' });
    
    input.value='';

    try{
        const res=await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:text})
        });
        if(!res.ok) throw new Error('Ошибка сервера');
        
        const data=await res.json();
        const botName = data.bot_name || currentBotName;
        const responseText = data.response || 'Не удалось получить ответ.';
        const sources = data.sources || [];
        
        addMessage(botName, responseText, 'bot', sources);
        chats[currentChatId].push({ author: botName, text: responseText, type: 'bot', sources: sources });

    }catch(e){
        addMessage(currentBotName, 'Произошла ошибка при отправке сообщения. Попробуйте ещё раз.', 'bot');
    }finally{
        isSending=false;
        $('sendBtn').disabled=false;
        input.focus();
    }
}

function escapeHTML(v){
    return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function addMessage(author, text, type, sources=[]){
    const container=$('messages'), msg=document.createElement('article');
    msg.className=`message ${type}`;
    const avatar = type==='bot' ? '' : 'Вы';
    
    let sourcesHtml='';
    if(Array.isArray(sources) && sources.length){
        sourcesHtml=`<div class="sources-block"><div class="sources-title">Источники</div><ul>${
            sources.map(s => {
                // Если источник объект {title, url} или просто строка
                const url = typeof s === 'object' ? s.url : s;
                const title = typeof s === 'object' ? (s.title || s.url) : s;
                return `<li><a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a></li>`;
            }).join('')
        }</ul></div>`;
    }
    
    msg.innerHTML=`<div class="message-avatar">${escapeHTML(avatar)}</div><div class="message-body"><div class="msg-author">${escapeHTML(author)}</div><div class="msg-text">${escapeHTML(text)}</div>${sourcesHtml}</div>`;
    container.appendChild(msg);
    container.scrollTop=container.scrollHeight;
}

function addChatToSidebar(id, firstText){
    const history = $('chatHistory');
    const item = document.createElement('button');
    item.className = 'history-item active';
    item.dataset.id = id;
    item.textContent = firstText.length > 22 ? firstText.substring(0, 22) + '...' : firstText;
    
    item.onclick = () => loadChat(id);
    
    item.oncontextmenu = e => {
        e.preventDefault();
        contextTargetElement = item;
        const menu = $('contextMenu');
        menu.style.left = `${e.clientX}px`;
        menu.style.top = `${e.clientY}px`;
        menu.style.display = 'block';
    };

    // Снимаем активный класс со старых
    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
    history.prepend(item);
}

function loadChat(id){
    currentChatId = id;
    
    // Подсветка в сайдбаре
    document.querySelectorAll('.history-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
    });

    $('welcomeScreen').style.display = 'none';
    $('messages').style.display = 'flex';
    $('messages').innerHTML = '';

    if(chats[id]){
        chats[id].forEach(msg => {
            addMessage(msg.author, msg.text, msg.type, msg.sources || []);
        });
    }
    closeSidebar();
}

function deleteTargetChat(){
    if(contextTargetElement){
        const id = contextTargetElement.dataset.id;
        delete chats[id];
        contextTargetElement.remove();
        if(currentChatId === id) createNewChat();
    }
    hideContextMenu();
}

function hideContextMenu(){ $('contextMenu').style.display='none'; }

document.addEventListener('click',e=>{
    if(!e.target.closest('.context-menu')) hideContextMenu();
    if(innerWidth<=760&&!e.target.closest('.sidebar')&&!e.target.closest('.mobile-menu')) closeSidebar();
});

function toggleSettings(){
    const m=$('settingsModal');
    m.style.display = m.style.display==='flex' ? 'none' : 'flex';
}

async function saveSettings(){
    const u=$('settingUserName').value.trim(), b=$('settingBotName').value.trim();
    try{
        await fetch('/api/settings',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({user_name:u,bot_name:b})
        });
    }catch(e){}
    if(u) currentUserName=u;
    if(b) currentBotName=b;
    updateUI();
    toggleSettings();
}

document.addEventListener('keydown',e=>{
    if(e.ctrlKey&&e.shiftKey&&e.code==='KeyO'){ e.preventDefault(); createNewChat(); }
    if(e.ctrlKey&&e.code==='Comma'){ e.preventDefault(); toggleSettings(); }
    if(e.key==='Escape'){ closeSidebar(); hideContextMenu(); if($('settingsModal').style.display==='flex') toggleSettings(); }
});
</script>
</body>
</html>
